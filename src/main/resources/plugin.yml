name: WebBag
version: '1.4.1'
main: cn.mcfhm.webbag.WebBagPlugin
api-version: '26.3'
description: 在浏览器查看全部玩家（含离线）的背包、装备与末影箱
author: 繁花梦 / mcfhm.cn
website: https://mcfhm.cn

commands:
  webbag:
    description: 获取网页背包总览链接
    usage: /webbag [link|key|newkey|status|reload]
    aliases: [wbag, wbg]
    permission: webbag.admin
    permission-message: 只有管理员可以使用该指令

permissions:
  webbag.admin:
    description: 查看网页背包总览、管理访问口令
    default: op
